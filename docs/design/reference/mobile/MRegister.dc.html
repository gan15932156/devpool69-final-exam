<div style="position: relative; padding: 28px 20px 30px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 10px"><span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; background: #A8322A; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 3px #A8322A, inset 0 0 0 4px #FBF5EA"><svg width="23" height="23" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink: 0"><path d="M12 1.5L22.5 12L12 22.5L1.5 12Z" fill="none" stroke="#FBF5EA" stroke-width="1.4" stroke-linejoin="round"></path><path d="M12 3.8C14.5 6.1 14.2 8.8 12 10.4C9.8 8.8 9.5 6.1 12 3.8ZM20.2 12C17.9 14.5 15.2 14.2 13.6 12C15.2 9.8 17.9 9.5 20.2 12ZM12 20.2C9.5 17.9 9.8 15.2 12 13.6C14.2 15.2 14.5 17.9 12 20.2ZM3.8 12C6.1 9.5 8.8 9.8 10.4 12C8.9 14.2 6.1 14.5 3.8 12Z" fill="#FBF5EA"></path><circle cx="12" cy="12" r="1.5" fill="#A8322A"></circle></svg></span><span style="font-family: Pridi, serif; font-weight: 600; font-size: 24px">โต๊ะว่าง</span></div>
<h1 style="margin: 0; font-family: Pridi, serif; font-weight: 600; letter-spacing: -0.01em; font-size: 32px; line-height: 1.3; margin-top: 10px">สมัครครั้งเดียว<br>จองก็ได้ เปิดร้านก็ได้</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #D9DCEA">เริ่มจากเป็นลูกค้า แล้วค่อยเปิดร้านเมื่อพร้อม</p>
<div style="display: flex; gap: 8px; margin-top: 4px">
<span style="flex-grow: 1; flex-basis: 0; display: flex; align-items: center; gap: 6px; padding: 8px; border-radius: 8px; border: 1px solid rgba(233, 199, 122, 0.45); font-size: 13px"><strong style="font-family: Pridi, serif; color: #E9C77A; font-size: 16px">๑</strong>สมัคร</span>
<span style="flex-grow: 1; flex-basis: 0; display: flex; align-items: center; gap: 6px; padding: 8px; border-radius: 8px; border: 1px solid rgba(233, 199, 122, 0.45); font-size: 13px"><strong style="font-family: Pridi, serif; color: #E9C77A; font-size: 16px">๒</strong>จอง รีวิว</span>
<span style="flex-grow: 1; flex-basis: 0; display: flex; align-items: center; gap: 6px; padding: 8px; border-radius: 8px; border: 1px solid rgba(233, 199, 122, 0.45); font-size: 13px"><strong style="font-family: Pridi, serif; color: #E9C77A; font-size: 16px">๓</strong>เปิดร้าน</span>
</div></div>
</section>
<div style="height: 10px; flex-shrink: 0; background: #A8322A; box-shadow: inset 0 3px 0 #E9C77A"></div>
<div style="padding: 26px 20px 32px; display: flex; flex-direction: column; gap: 16px">
<div>
<h2 style="margin: 0; font-family: Pridi, serif; font-weight: 600; letter-spacing: -0.01em; font-size: 28px">สร้างบัญชี</h2>
<p style="margin: 2px 0 0; font-size: 15px; color: #6B5A48">ไม่ต้องเลือกบทบาท — ใช้จอง รีวิว และเปิดร้านได้ในบัญชีเดียว</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="rn" style="font-size: 15px; font-weight: 600">ชื่อที่แสดง</label>
<input id="rn" type="text" value="{{name}}" onChange="{{onName}}" placeholder="ชื่อที่จะแสดงในรีวิว" style="height: 52px; box-sizing: border-box; width: 100%; padding: 0 14px; border: 1px solid #CDB892; border-radius: 8px; background: #FFFBF3; font-size: 17px; color: #231812">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="re" style="font-size: 15px; font-weight: 600">อีเมล</label>
<input id="re" type="email" value="{{email}}" onChange="{{onEmail}}" placeholder="you@example.com" style="height: 52px; box-sizing: border-box; width: 100%; padding: 0 14px; border: 1px solid {{emailBorder}}; border-radius: 8px; background: #FFFBF3; font-size: 17px; color: #231812">
<sc-if value="{{emailBad}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 14px; color: #A8322A">รูปแบบอีเมลไม่ถูกต้อง</span>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="rp" style="font-size: 15px; font-weight: 600">รหัสผ่าน</label>
<input id="rp" type="password" value="{{pw}}" onChange="{{onPw}}" placeholder="อย่างน้อย 8 ตัว" style="height: 52px; box-sizing: border-box; width: 100%; padding: 0 14px; border: 1px solid #CDB892; border-radius: 8px; background: #FFFBF3; font-size: 17px; color: #231812">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="rc" style="font-size: 15px; font-weight: 600">ยืนยันรหัสผ่าน</label>
<input id="rc" type="password" value="{{pw2}}" onChange="{{onPw2}}" placeholder="พิมพ์ซ้ำ" style="height: 52px; box-sizing: border-box; width: 100%; padding: 0 14px; border: 1px solid #CDB892; border-radius: 8px; background: #FFFBF3; font-size: 17px; color: #231812">
</div>
<ul aria-label="เงื่อนไขรหัสผ่าน" style="margin: 0; padding: 12px 14px; list-style: none; display: flex; flex-direction: column; gap: 8px; border-radius: 8px; background: #FFFBF3; border: 1px dashed #CDB892">
<sc-for list="{{rules}}" as="r" hint-placeholder-count="3">
<li style="display: flex; align-items: center; gap: 8px; font-size: 15px; color: {{r.color}}">
<span style="width: 18px; height: 18px; flex-shrink: 0; border-radius: 50%; background: {{r.dot}}; color: #FBF5EA; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>{{r.text}}</li>
</sc-for>
</ul>
<button type="button" role="switch" aria-checked="{{shopChecked}}" onClick="{{toggleShop}}" style="display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px; border-radius: 10px; border: 1px solid {{shopBorder}}; background: {{shopBg}}; color: #231812">
<span style="width: 44px; height: 26px; flex-shrink: 0; box-sizing: border-box; border-radius: 999px; padding: 3px; background: {{trackBg}}; display: flex; justify-content: {{knobSide}}"><span style="width: 20px; height: 20px; border-radius: 50%; background: #FBF5EA"></span></span>
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 700">อยากเปิดร้านด้วย</span>
<span style="font-size: 14px; color: #6B5A48">สมัครเสร็จแล้วพาไปสร้างร้านต่อ</span>
</span>
</button>
<label style="display: flex; align-items: flex-start; gap: 10px; font-size: 15px; line-height: 1.5; color: #4A3A2C; cursor: pointer">
<input type="checkbox" checked="{{agree}}" onChange="{{onAgree}}" style="width: 22px; height: 22px; margin: 1px 0 0; accent-color: #1E2B5E; flex-shrink: 0">
<span>ยอมรับ <a href="#">ข้อกำหนดการใช้งาน</a> และ <a href="#">นโยบายความเป็นส่วนตัว</a></span>
</label>
<sc-if value="{{ok}}" hint-placeholder-val="{{ false }}">
<a href="{{nextHref}}" style="display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 8px; background: #1E2B5E; color: #FBF5EA; font-size: 17px; font-weight: 700; text-decoration: none">{{ctaText}}</a>
</sc-if>
<sc-if value="{{notOk}}" hint-placeholder-val="{{ true }}">
<button type="button" disabled="{{ true }}" style="min-height: 54px; border: 0; border-radius: 8px; background: #E2D6C0; color: #6E604E; font-size: 17px; font-weight: 700">{{ctaText}}</button>
</sc-if>
<p style="margin: 0; font-size: 15px; color: #6B5A48; text-align: center">มีบัญชีแล้ว? <a href="MLogin.dc.html" style="font-weight: 700; color: #A8322A">เข้าสู่ระบบ</a></p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1320}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { name: 'มะลิ', email: 'mali@example.com', pw: 'khaotom1', pw2: '', agree: false, shop: false };
  }
  renderVals() {
    const st = this.state;
    const emailOk = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(st.email);
    const emailBad = st.email.length > 0 && !emailOk;
    const lenOk = st.pw.length >= 8;
    const numOk = /[0-9]/.test(st.pw);
    const matchOk = st.pw2.length > 0 && st.pw2 === st.pw;
    const rule = (good, text) => ({ text, color: good ? '#2F5A2B' : '#6B5A48', dot: good ? '#3F6B3A' : '#CDB892' });
    const ok = st.name.trim().length > 0 && emailOk && lenOk && numOk && matchOk && st.agree;
    const set = (k) => (e) => this.setState({ [k]: e.target.value });
    return {
      name: st.name, email: st.email, pw: st.pw, pw2: st.pw2, agree: st.agree,
      onName: set('name'), onEmail: set('email'), onPw: set('pw'), onPw2: set('pw2'),
      onAgree: (e) => this.setState({ agree: e.target.checked }),
      emailBad,
      emailBorder: emailBad ? '#A8322A' : '#CDB892',
      rules: [rule(lenOk, 'อย่างน้อย 8 ตัว'), rule(numOk, 'มีตัวเลข'), rule(matchOk, 'ยืนยันตรงกัน')],
      shopChecked: st.shop ? 'true' : 'false',
      toggleShop: () => this.setState({ shop: !st.shop }),
      shopBorder: st.shop ? '#1E2B5E' : '#CDB892',
      shopBg: st.shop ? '#E3E5EF' : '#FFFBF3',
      trackBg: st.shop ? '#1E2B5E' : '#C9B9A0',
      knobSide: st.shop ? 'flex-end' : 'flex-start',
      ok, notOk: !ok,
      nextHref: st.shop ? 'MShopForm.dc.html' : 'MSearch.dc.html',
      ctaText: st.shop ? 'สมัครแล้วไปสร้างร้าน' : 'สมัครและเริ่มใช้งาน'
    };
  }
}
</script>
</body>
</html>
