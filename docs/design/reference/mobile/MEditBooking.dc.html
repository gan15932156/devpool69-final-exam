<sc-if value="{{hasOver}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; gap: 5px; padding-left: 10px; border-left: 2px dashed #A8322A">
<sc-for list="{{outside}}" as="s" hint-placeholder-count="1">
<span title="เกินที่นั่ง" style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; background: #F6DED7; border: 1.5px dashed #A8322A"></span>
</sc-for>
</div>
</sc-if>
</div>
<p role="status" style="margin: 0; font-size: 15px; font-weight: 700; line-height: 1.5; color: {{msgColor}}">{{msg}}</p>
<p style="margin: 0; font-size: 13px; color: #6B5A48">ที่นั่งเดิม 7 ที่ของคุณถูกนำมาคิดใหม่ ไม่นับซ้ำ</p>
</div>
<button type="button" disabled="{{notOk}}" style="min-height: 54px; border: 0; border-radius: 8px; font-size: 17px; font-weight: 700; background: {{btnBg}}; color: {{btnFg}}">บันทึกการแก้ไข</button>
<p style="margin: -4px 0 0; font-size: 13px; color: #6B5A48; text-align: center">ยกเลิกได้ถึง ศ. 25 ก.ย. 11:30</p>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { party: 8 };
  }
  renderVals() {
    const SEATS = 10, OTHERS = 3;
    const party = this.state.party;
    const need = OTHERS + party;
    const ok = need <= SEATS;
    const inside = [];
    for (let i = 0; i < SEATS; i++) {
      if (i < OTHERS) inside.push({ bg: '#C9B48A', border: '#C9B48A', label: 'คนอื่นจองแล้ว' });
      else if (i < need) inside.push({ bg: '#1E2B5E', border: '#1E2B5E', label: 'การจองของคุณ' });
      else inside.push({ bg: '#FFFBF3', border: '#CDB892', label: 'ว่าง' });
    }
    const outside = [];
    for (let i = SEATS; i < need; i++) outside.push({ i });
    const msg = ok
      ? 'ที่นั่งพอ — คนอื่น 3 + คุณ ' + party + ' = ' + need + ' ที่' + (need < SEATS ? ' เหลือว่าง ' + (SEATS - need) + ' ที่' : ' เต็มพอดี')
      : 'ที่นั่งไม่พอ — คนอื่น 3 + คุณ ' + party + ' = ' + need + ' ที่ เกิน 10 ที่ (ต้องใช้ ' + need + ' ที่)';
    return {
      party,
      need,
      inside, outside,
      hasOver: outside.length > 0,
      dec: () => this.setState({ party: Math.max(1, party - 1) }),
      inc: () => this.setState({ party: party + 1 }),
      decOff: party <= 1,
      msg,
      msgColor: ok ? '#2F5A2B' : '#A8322A',
      panelBg: ok ? '#EEF3E8' : '#FBEDE8',
      panelBorder: ok ? '#C8D8BC' : '#E9BBAE',
      partyBorder: ok ? '#CDB892' : '#A8322A',
      notOk: !ok,
      btnBg: ok ? '#1E2B5E' : '#E2D6C0',
      btnFg: ok ? '#FBF5EA' : '#6E604E'
    };
  }
}
</script>
</body>
</html>
