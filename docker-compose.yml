# docker compose up --build → เปิด http://localhost:3000 ได้เลย (API seed ข้อมูลตัวอย่างครั้งแรกที่ DB ว่าง · รอบต่อไปข้อมูลอยู่ต่อ)
# ไม่ต้องมีไฟล์ .env: กุญแจ JWT สุ่มเก็บไว้ใน DB · AUTH_SECRET สุ่มตอน web เริ่ม (ไม่มีค่าลับที่เขียนไว้ใน repo)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: toawang
      POSTGRES_PASSWORD: toawang
      POSTGRES_DB: toawang
    ports:
      - "127.0.0.1:5433:5432" # เปิดให้เครื่องนี้เท่านั้น (รหัสผ่านอยู่ในไฟล์นี้) · เครื่อง dev มี Postgres อื่นใช้ 5432 อยู่
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toawang -d toawang"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://toawang:toawang@db:5432/toawang?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-} # ไม่ตั้ง = API สุ่มกุญแจแล้วเก็บไว้ใน DB เอง
      # true = seed เฉพาะตอน DB ว่าง ข้อมูลที่ทดสอบอยู่รอดข้าม restart · ล้างแล้ว seed ใหม่: $env:SEED_ON_START="reset"; docker compose up -d api
      SEED_ON_START: ${SEED_ON_START:-true}
    volumes:
      # รูปที่อัปโหลดอยู่รอดแม้สร้าง container ใหม่ · ใช้ชื่อใหม่เพราะ volume เดิมเป็นของ root แต่ตอนนี้ api รันเป็น user ธรรมดา
      - uploads-data:/app/uploads
    ports:
      - "127.0.0.1:8080:8080" # ยิง requests.http ได้จากเครื่องนี้ · เครื่องอื่นใน LAN เข้าไม่ได้
    depends_on:
      db:
        condition: service_healthy # รอจน DB พร้อมรับคำสั่งจริง ไม่ใช่แค่ container เปิด

  web:
    build:
      context: ./web
      args:
        API_URL: http://api:8080
    environment:
      API_URL: http://api:8080 # ใช้ตอน runtime ใน NextAuth authorize() และ /api/v1/* (เรียก Go ฝั่ง server)
      AUTH_SECRET: ${AUTH_SECRET:-} # ไม่ตั้ง = สุ่มใหม่ตอน container เริ่ม
      AUTH_TRUST_HOST: "true"
      # ที่อยู่ที่เบราว์เซอร์เปิด · ไม่ตั้ง NextAuth จะใช้ 0.0.0.0:3000 (ค่า HOSTNAME ใน container) ตอน redirect หลัง logout
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db-data:
  uploads-data:
